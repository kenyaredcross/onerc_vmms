<!doctype html>
<html lang="{{ lang }}"{% if lang == "ar" %} dir="rtl"{% endif %}>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>VMMS Portal</title>
		{%- for href in bundle_css %}
		<link rel="stylesheet" href="{{ href }}" />
		{%- endfor %}
	</head>
	<body>
		<div id="root"></div>
		<script>
			window.csrf_token = "{{ csrf_token }}";
			window.frappe = { boot: { sitename: "{{ sitename }}", lang: "{{ lang }}" } };
			// A tab left open during a rebuild can still request a chunk from the old build.
			// Reload once to fetch the current entry, with a cooldown if the server is unavailable.
			window.addEventListener("vite:preloadError", function (event) {
				event.preventDefault();
				var key = "vmms:asset-reload";
				var last = Number(sessionStorage.getItem(key) || 0);
				if (Date.now() - last > 30000) {
					sessionStorage.setItem(key, String(Date.now()));
					window.location.reload();
				}
			});
		</script>
		{%- if bundle_js %}
		<script type="module" src="{{ bundle_js }}"></script>
		{%- else %}
		<p style="font-family: sans-serif; padding: 40px">Frontend bundle not built yet. Run the Vite build.</p>
		{%- endif %}
	</body>
</html>
